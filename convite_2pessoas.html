<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
  <title>Cheers to Sónia's 50 Wonderful Years</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#f5f0eb;display:flex;flex-direction:column;align-items:center;min-height:100vh}
    .wrap{position:relative;width:100%;max-width:480px}
    .wrap img{width:100%;height:auto;display:block}
    .btn-loc{position:absolute;left:18%;right:18%;top:calc(42.32% - 1.6%);height:3.2%;border-radius:50px;background:transparent;cursor:pointer;display:block;text-decoration:none}
    .btn-rsvp{position:absolute;left:18%;right:18%;top:calc(85.56% - 1.6%);height:3.2%;border-radius:50px;background:transparent;cursor:pointer;display:block;text-decoration:none}
    .music-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(10,5,0,0.88);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;gap:12px;padding:10px 20px 14px;z-index:50}
    .music-label{color:rgba(255,255,255,0.65);font-family:Georgia,serif;font-size:10px;letter-spacing:2.5px;text-transform:uppercase}
    .music-btn{background:none;border:1px solid rgba(255,255,255,0.45);color:#fff;border-radius:50%;width:34px;height:34px;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .2s}
    .music-btn:hover{background:rgba(255,255,255,0.12)}
    .vol{-webkit-appearance:none;appearance:none;width:75px;height:3px;background:rgba(255,255,255,0.25);border-radius:2px;outline:none;cursor:pointer}
    .vol::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:#d4a855;cursor:pointer}
    .spacer{height:64px}
    .tap{position:fixed;inset:0;background:rgba(0,0,0,0.82);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:200;cursor:pointer}
    .tap.gone{display:none}
    .tap-ring{width:90px;height:90px;border-radius:50%;border:1.5px solid rgba(212,168,85,0.7);display:flex;align-items:center;justify-content:center;font-size:34px;color:#d4a855;margin-bottom:20px;animation:pulse 2s infinite}
    .tap-txt{color:rgba(255,255,255,0.85);font-family:Georgia,serif;font-size:12px;letter-spacing:3px;text-transform:uppercase}
    @keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.1);opacity:.6}}
  </style>
</head>
<body>
  <div class="tap" id="tap" onclick="unlock()">
    <div class="tap-ring">♫</div>
    <div class="tap-txt">Toque para abrir o convite</div>
  </div>
  <div class="wrap">
    <img src="convite_2pessoas.jpg" alt="Cheers to Sónia's 50 Wonderful Years"/>
    <a class="btn-loc"  href="https://maps.app.goo.gl/1tQFyC3hunMgwUgg8?g_st=iw"  target="_blank" rel="noopener" aria-label="Localização"></a>
    <a class="btn-rsvp" href="https://docs.google.com/forms/d/e/1FAIpQLScA03l4kB6O5m8wBbiKtL0Xw2vSqr96Q_qPy-C8NiZysboI3Q/viewform?usp=header" target="_blank" rel="noopener" aria-label="RSVP"></a>
  </div>
  <div class="spacer"></div>
  <div class="music-bar">
    <span class="music-label">♪ Música</span>
    <button class="music-btn" id="playBtn" onclick="toggleAudio()">⏸</button>
    <input class="vol" type="range" min="0" max="1" step="0.05" value="0.75" oninput="setVol(this.value)"/>
  </div>
  <audio id="bgAudio" loop preload="auto">
    <source src="musica.mp3" type="audio/mpeg"/>
  </audio>
  <script>
    const audio=document.getElementById('bgAudio');
    const playBtn=document.getElementById('playBtn');
    const tap=document.getElementById('tap');
    audio.volume=0.75;
    function unlock(){tap.classList.add('gone');audio.play().catch(e=>console.warn(e))}
    function toggleAudio(){audio.paused?audio.play():audio.pause()}
    audio.addEventListener('play',()=>{playBtn.textContent='⏸'});
    audio.addEventListener('pause',()=>{playBtn.textContent='▶'});
    function setVol(v){audio.volume=parseFloat(v)}
  </script>
</body>
</html>
